name: essence-feature-stats

on:
  push:
    branches:
      - main
    paths:
      - essence-feature-usage-stats/**
      - .github/workflows/essence-feature-stats.yml
  workflow_dispatch:
  pull_request:
    paths:
      - essence-feature-usage-stats/**
      - .github/workflows/essence-feature-stats.yml

concurrency:
  group: conjure-oxide-reports-deploy
  cancel-in-progress: false

env:
  ESSENCE_DIR: "./EssenceRepos"
  CONJURE_DIR: "./conjure"
  CONJURE_REPO: "https://github.com/conjure-cp/conjure"
  EXCLUDE_PATHS_REGEX: ".*autogen.*"
  OUTPUT_PATH: "./web/static/index.html"
  MAX_N_FILES: 5000
  ESSENCE_FILE_REPOS: >
    https://github.com/conjure-cp/EssenceCatalog::master,
    https://github.com/conjure-cp/conjure::main
  KEYWORD_BLOCKLIST: >
    mInfo,finds,givens,enumGivens,enumLettings,lettings,
    unnameds,strategyQ,Auto,Interactive,strategyA,trailCompact,
    nameGenState,nbExtraGivens,representations,representationsTree,
    originalDomains,trailGeneralised,trailVerbose,trailRewrites,
    mLanguage,language,version,mStatements,Name,Declaration,Op

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: pip install -r requirements.txt
        working-directory: ./essence-feature-usage-stats

      - name: Run main.py to generate the table
        run: python main.py
        working-directory: ./essence-feature-usage-stats

      - name: Fix file permissions
        run: chmod -v -R +rwx ./web/static/
        working-directory: ./essence-feature-usage-stats

      - name: Add the .nojekyll file
        run: touch ./web/static/.nojekyll
        working-directory: ./essence-feature-usage-stats

      - name: Create reports app token
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        id: reports-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CONJURE_BOT_ID }}
          private-key: ${{ secrets.CONJURE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            conjure-oxide-reports

      - name: Checkout reports repository
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          repository: conjure-cp/conjure-oxide-reports
          ref: main
          token: ${{ steps.reports-token.outputs.token }}
          path: conjure-oxide-reports

      - name: Prepare reports repository update
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          target="conjure-oxide-reports/main/essence-feature-usage-stats"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R essence-feature-usage-stats/web/static/. "$target/"

      - name: Commit and push reports repository update
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        working-directory: conjure-oxide-reports
        run: |
          set -euo pipefail

          git config user.name "conjure-bot"
          git config user.email "conjure-bot@users.noreply.github.com"
          git add main/essence-feature-usage-stats

          if git diff --staged --quiet; then
            echo "No reports changes to commit."
          else
            git commit -m "Actions: Deploy the essence features usage table"
            git push origin main
          fi
